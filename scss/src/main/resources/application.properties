spring.application.name=SCSS
server.port=8080
# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/course_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 配置
# MyBatis-Plus 配置
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
logging.level.org.springframework.boot.autoconfigure=DEBUG
# JWT 配置
JWT_SECRET=${JWT_SECRET}
# Access Token 配置
JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:请替换为一个随机生成的32字节以上密钥}
JWT_ACCESS_EXPIRATION=1800000

# Refresh Token 配置
JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:请替换为另一个随机生成的32字节以上密钥}
JWT_REFRESH_EXPIRATION=604800000